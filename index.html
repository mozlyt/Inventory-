<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#13120e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f3ec" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MOZLYT Stock">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MOZLYT Inventory</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="app.css?v=5">
</head>
<body>

<!-- ============ SIGN IN ============ -->
<section class="gate" id="loginView" hidden>
  <form class="card" id="loginForm" autocomplete="on">
    <div class="brand"><img src="icons/icon-192.png" alt=""><div><div class="eyebrow">MOZLYT</div><h1>Inventory</h1></div></div>
    <p class="muted">Private. Sign in with your MOZLYT account.</p>
    <label class="f">Email<input id="lgEmail" type="email" autocomplete="username" required></label>
    <label class="f">Password<input id="lgPass" type="password" autocomplete="current-password" minlength="8" required></label>
    <button class="btn-primary btn-block" type="submit" id="lgBtn">Sign in</button>
    <p class="small muted" id="lgMsg" role="status"></p>
  </form>
</section>

<section class="gate" id="lockedView" hidden>
  <div class="card">
    <div class="brand"><img src="icons/icon-192.png" alt=""><div><div class="eyebrow">MOZLYT</div><h1>Inventory</h1></div></div>
    <h2>Waiting for approval</h2>
    <p>You're signed in as <b id="lockedEmail"></b>, but this account hasn't been approved to see the records.</p>
    <div class="row"><button class="btn-primary" type="button" id="lockedRetry">Check again</button><button class="btn-ghost" type="button" id="lockedOut">Sign out</button></div>
  </div>
</section>

<section class="gate" id="bootView">
  <div class="card" style="align-items:center;text-align:center">
    <img src="icons/icon-192.png" alt="" width="64" height="64" style="border-radius:16px">
    <p class="muted" id="bootMsg">Opening MOZLYT Inventory…</p>
  </div>
</section>

<!-- ============ APP ============ -->
<div class="shell" id="appView" hidden>
  <header class="topbar">
    <div class="in">
      <h1 id="screenTitle">Home</h1>
      <label class="datechip btn-ghost" style="border:1px solid var(--line)" title="Change the working date">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span id="dateLabel">Today</span>
        <input type="date" id="day" aria-label="Working date">
      </label>
      <button class="btn-icon btn-ghost" id="refreshBtn" aria-label="Refresh"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
      <button class="btn-icon btn-ghost" id="settingsBtn" aria-label="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>

  <main>
    <div id="banner" class="banner" hidden><span id="bannerText"></span><button class="btn-ghost" id="bannerBtn">Try again</button></div>
    <section class="screen" id="scr-home"></section>
    <section class="screen" id="scr-sell" hidden></section>
    <section class="screen" id="scr-stock" hidden></section>
    <section class="screen" id="scr-team" hidden></section>
    <section class="screen" id="scr-money" hidden></section>
  </main>

  <nav class="nav" aria-label="Main">
    <div class="in">
      <button data-go="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
      <button data-go="stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Stock</button>
      <button data-go="sell" class="sell"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></span>Sell</button>
      <button data-go="team"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 14.5a5 5 0 0 1 5.5 5.5"/></svg>Team</button>
      <button data-go="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 10v5M18 10v5"/></svg>Money</button>
    </div>
  </nav>
</div>

<dialog class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="head"><h2 id="sheetTitle"></h2><button class="btn-icon btn-ghost" id="sheetClose" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="body" id="sheetBody"></div>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script src="app.js?v=5"></script>
</body>
</html>
